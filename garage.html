<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>A.R.G.U.S. · CybernetLab Garage</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
:root{--oro:#20d9ff;--oro2:#b5f4ff;--scuro:#030711;--testo:#e8f7ff;--grigio:#8da9c1;--linea:rgba(32,217,255,.26)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--scuro);color:var(--testo);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
#scena{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;z-index:5;padding:14px clamp(14px,3vw,36px);display:flex;flex-direction:column;gap:12px;pointer-events:none;
  background:linear-gradient(180deg,rgba(5,5,10,.9),rgba(5,5,10,.55) 70%,transparent)}
.hud>*{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eti{font-size:11.5px;letter-spacing:.34em;color:var(--oro);text-transform:uppercase}
.titolo h1{margin:3px 0 0;font-size:clamp(18px,2.4vw,26px);letter-spacing:.18em}
.titolo h1 span{color:var(--oro2)}
button{font:inherit;cursor:pointer;color:var(--oro2);background:rgba(32,217,255,.08);border:1px solid rgba(32,217,255,.42);border-radius:10px;padding:8px 13px;backdrop-filter:blur(6px)}
button:hover,button:focus-visible{background:rgba(32,217,255,.18);outline:none;box-shadow:0 0 16px rgba(32,217,255,.28)}
button[aria-pressed="true"]{background:rgba(32,217,255,.24);color:#fff}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--linea);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--grigio);background:rgba(10,10,14,.7);cursor:pointer;user-select:none;backdrop-filter:blur(6px)}
.chip b{color:var(--oro2);margin-left:4px}.chip.su{border-color:var(--oro);color:var(--oro2);background:rgba(32,217,255,.14)}
.cerca{flex:1;min-width:180px;max-width:360px;padding:8px 13px;border-radius:999px;border:1px solid var(--linea);background:rgba(10,10,14,.75);color:var(--testo);font:inherit;font-size:13.5px}
.cerca:focus{outline:none;border-color:var(--oro)}
.stato{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;color:var(--grigio);font-size:15px;text-align:center;max-width:80vw;pointer-events:none}
.stato.err{color:#ffb4a8}
.piede{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px clamp(14px,3vw,36px) 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:linear-gradient(0deg,rgba(5,5,10,.9),transparent);pointer-events:none}
.piede>*{pointer-events:auto}
.info{max-width:560px}
.info .id{font:700 12px ui-monospace,Consolas,monospace;letter-spacing:.26em;color:var(--oro)}
.info h2{margin:4px 0 4px;font-size:clamp(20px,3vw,30px)}
.info p{margin:0;color:#b9d8ed;font-size:14px;line-height:1.5}
.nav{display:flex;gap:8px;align-items:center}
.nav button{width:46px;height:46px;border-radius:50%;padding:0;font-size:18px}
.nav .apri{width:auto;border-radius:999px;padding:0 18px}
.aiuto{font-size:11.5px;color:var(--grigio);margin-top:6px}
/* vista elenco (senza 3D o a richiesta) */
#elenco{position:fixed;inset:0;z-index:3;overflow:auto;padding:170px clamp(14px,3vw,36px) 120px;background:var(--scuro);display:none}
#elenco.su{display:block}
.posti{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:16px;max-width:1240px;margin:0 auto}
.posto{display:flex;flex-direction:column;text-align:left;color:inherit;font:inherit;padding:20px;min-height:200px;border-radius:16px;cursor:pointer;border:1px solid var(--linea);
  background:linear-gradient(180deg,rgba(11,23,42,.94),rgba(10,10,12,.94))}
.posto.sel{border-color:var(--oro);box-shadow:0 0 0 2px rgba(32,217,255,.5)}
.posto img,.scheda .mock{width:100%;border-radius:12px;border:1px solid var(--linea);display:block;object-fit:cover}
.posto img{aspect-ratio:4/3;margin-bottom:12px}.scheda .mock{max-height:46vh;object-fit:contain;background:#000;margin:10px 0 4px}
.posto .id{font:700 12px ui-monospace,Consolas,monospace;letter-spacing:.24em;color:var(--oro)}
.posto h3{margin:12px 0 8px;font-size:20px}.posto p{margin:0;color:#b9d8ed;font-size:14px;line-height:1.5}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pill{font-size:11.5px;padding:4px 9px;border-radius:6px;border:1px solid var(--linea);color:var(--grigio)}
.pill.s-Parcheggiato{color:#c4f3ff;border-color:rgba(32,217,255,.5)}.pill.s-In-valutazione{color:#9fd3ff;border-color:rgba(120,190,255,.45)}
.pill.s-Promosso{color:#9ff0b6;border-color:rgba(110,220,150,.5)}.pill.s-Archiviato{opacity:.6}
/* scheda di dettaglio */
.velo{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:rgba(3,3,6,.72);backdrop-filter:blur(6px)}
.velo[hidden]{display:none}
.scheda{width:min(720px,100%);max-height:88vh;overflow:auto;border:1px solid rgba(32,217,255,.5);border-radius:18px;padding:clamp(20px,4vw,34px);
  background:linear-gradient(180deg,rgba(8,20,39,.97),rgba(11,11,13,.97));box-shadow:0 0 70px rgba(32,217,255,.15)}
.scheda .riga{display:flex;justify-content:space-between;align-items:center;gap:10px}
.scheda h2{font-size:clamp(24px,4vw,36px);margin:12px 0 10px}
.scheda h4{margin:18px 0 6px;color:var(--oro);font-size:12px;letter-spacing:.24em;text-transform:uppercase}
.scheda p,.scheda li{color:#c4d9ec;line-height:1.65}.scheda ul{margin:0;padding-left:20px}.scheda a{color:var(--oro2)}
/* gesti */
.ghov{outline:2px solid var(--oro2)!important;outline-offset:3px}
#gcur{position:fixed;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:2px solid var(--oro2);box-shadow:0 0 14px rgba(32,217,255,.7);z-index:40;pointer-events:none}
#gcur.pz{background:rgba(181,244,255,.45)}
#gprev{position:fixed;right:14px;bottom:92px;z-index:30;border:1px solid rgba(32,217,255,.45);border-radius:12px;overflow:hidden;background:#000;cursor:pointer}
#gprev canvas{display:block;width:160px;height:120px;transform:scaleX(-1)}
#gprev span{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;padding:3px 6px;background:rgba(0,0,0,.6);color:var(--oro2)}
.conferma{position:fixed;left:50%;top:150px;transform:translateX(-50%);z-index:45;padding:12px 18px;border-radius:14px;border:1px solid var(--oro);background:rgba(6,18,35,.96);color:var(--oro2);font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.6);max-width:92vw}
.conferma[hidden]{display:none}
.zonaElimina{margin-top:26px;padding-top:16px;border-top:1px solid rgba(255,90,110,.25);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.zonaElimina button{background:transparent;color:#ff8c9a;border:1px solid rgba(255,90,110,.55);border-radius:999px;padding:9px 16px;font:inherit;cursor:pointer}
.zonaElimina button.pronto{background:#d9364d;color:#fff;border-color:#ff5a6e}
.zonaElimina small{color:#8fa4bb}
@media (max-width:640px){.titolo .eti{display:none}.titolo h1 span{display:none}.top button{padding:7px 10px;font-size:13px}.info p{display:none}.aiuto{display:none}}
</style>
</head>
<body>
<canvas id="scena" tabindex="0" aria-label="Hangar 3D delle idee: frecce per spostarsi, Invio per aprire"></canvas>

<div class="hud">
  <div class="top">
    <div class="titolo"><div class="eti">A.R.G.U.S. · CybernetLab</div><h1>GARAGE <span>· HANGAR DELLE IDEE</span></h1></div>
    <div><button id="gestiBtn" type="button" aria-pressed="false" title="Comandi con i gesti della mano (webcam)">✋ Gesti</button>
      <button id="vistaBtn" type="button" aria-pressed="false" title="Vista elenco">☰</button>
      <button id="aggiorna" type="button" title="Aggiorna">↻</button>
      <button id="indietro" type="button">← ARGUS</button></div>
  </div>
  <div class="barra"><span id="numeri" class="barra"></span><input class="cerca" id="cerca" type="search" placeholder="Cerca un'idea…" aria-label="Cerca tra le idee"></div>
</div>

<div class="stato" id="stato" role="status"></div>
<div id="elenco"><section class="posti" id="posti" aria-label="Idee parcheggiate"></section></div>

<div class="piede">
  <div class="info" id="info" aria-live="polite"></div>
  <div class="nav"><button id="prec" type="button" aria-label="Idea precedente">◀</button><button class="apri" id="apriBtn" type="button">APRI</button><button id="succ" type="button" aria-label="Idea successiva">▶</button></div>
</div>

<div class="velo" id="velo" hidden>
  <div class="scheda" role="dialog" aria-modal="true" aria-labelledby="sTitolo">
    <div class="riga"><span class="eti" id="sId"></span><button id="chiudi" type="button">Chiudi ×</button></div>
    <h2 id="sTitolo"></h2>
    <img class="mock" id="sImg" alt="Mockup dell'idea" hidden>
    <div class="meta" id="sMeta"></div>
    <h4>Descrizione</h4><p id="sDesc"></p>
    <h4>Funzioni</h4><ul id="sFunz"></ul>
    <h4>Note</h4><p id="sNote"></p>
    <div id="sVal"></div>
    <div class="zonaElimina"><button id="eliminaBtn" type="button">🗑 Elimina idea</button><small id="eliminaNota">Elimina per sempre (se vuoi solo nasconderla, usa 👎 archivia).</small></div>
  </div>
</div>

<div id="gcur" hidden></div>
<div id="gprev" hidden title="Tocca per nascondere l'anteprima"><canvas id="gcan"></canvas><span id="gprevT">GESTI</span></div>
<video id="gvid" playsinline muted hidden></video>
<div class="conferma" id="conferma" role="alert" hidden></div>

<script type="module">
const $ = id => document.getElementById(id);
let CFG = {}; try { CFG = JSON.parse(localStorage.getItem('jarvis_cfg')) || {}; } catch (e) {}
let IDEE = [], LISTA = [], FILTRO = '', SEL = 0, APERTA = null, CONF = null;
const STATI = ['Parcheggiato', 'In valutazione', 'Promosso', 'Archiviato'];
const COLORI = { 'Parcheggiato': 0x20d9ff, 'In valutazione': 0xa16cff, 'Promosso': 0x55e8b2, 'Archiviato': 0x63738e };
const ICONE = { entertainment: '🎬', productivity: '🗓️', servizi: '✂️', salute: '🩺', food: '🍝', ristor: '🍝', finanza: '💶', social: '💬', casa: '🏠', viaggi: '✈️', sport: '🏋️', scuola: '🎓', shop: '🛍️', ai: '🤖' };
function icona(x) { const c = String(x.categoria + ' ' + x.nome).toLowerCase(); for (const k in ICONE) if (c.indexOf(k) >= 0) return ICONE[k]; return '✦'; }
function stato(t, err) { $('stato').textContent = t || ''; $('stato').className = 'stato' + (err ? ' err' : ''); }
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function pill(t, cls) { return el('span', 'pill' + (cls ? ' ' + cls : ''), t); }

/* ================= DATI ================= */
function carica() {
  if (!CFG.url) { stato('Apri ARGUS su questo dispositivo, collega Apps Script dalle impostazioni ⚙ e torna qui.', true); return; }
  stato('Apro l\'hangar…');
  fetch(CFG.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ azione: 'garage_lista', codice: CFG.codice }), redirect: 'follow' })
    .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.errore || 'richiesta non riuscita'); IDEE = Array.isArray(j.idee) ? j.idee : []; filtra(); stato(''); caricaImmagini(); })
    .catch(e => stato('Non riesco a leggere il garage: ' + e.message, true));
}
function filtra() {
  const n = {}; IDEE.forEach(x => n[x.stato] = (n[x.stato] || 0) + 1);
  const num = $('numeri'); num.replaceChildren();
  const tutte = el('span', 'chip' + (FILTRO ? '' : ' su'), 'Tutte'); tutte.appendChild(el('b', null, String(IDEE.length))); tutte.onclick = () => { FILTRO = ''; filtra(); }; num.appendChild(tutte);
  STATI.forEach(s => { const c = el('span', 'chip' + (FILTRO === s ? ' su' : ''), s); c.appendChild(el('b', null, String(n[s] || 0))); c.onclick = () => { FILTRO = FILTRO === s ? '' : s; filtra(); }; num.appendChild(c); });
  const k = $('cerca').value.toLowerCase().trim();
  LISTA = IDEE.filter(x => (!FILTRO || x.stato === FILTRO) && (!k || [x.id, x.nome, x.descrizione, x.categoria, x.funzioni].join(' ').toLowerCase().indexOf(k) >= 0));
  SEL = Math.min(SEL, Math.max(0, LISTA.length - 1));
  disegnaElenco(); if (H.pronto) H.costruisci(); aggiornaInfo();
  if (!LISTA.length) stato(IDEE.length ? 'Nessuna idea con questi filtri.' : 'L\'hangar è vuoto: di\' ad ARGUS «parcheggia nel garage l\'idea di…».'); else stato('');
}
function disegnaElenco() {
  const box = $('posti'); box.replaceChildren();
  LISTA.forEach((x, i) => {
    const b = el('button', 'posto' + (i === SEL ? ' sel' : '')); b.type = 'button';
    if (IMG[x.id]) { const im = el('img'); im.src = IMG[x.id].src; im.alt = 'Mockup di ' + x.nome; b.appendChild(im); }
    b.appendChild(el('div', 'id', x.id)); b.appendChild(el('h3', null, icona(x) + '  ' + x.nome)); b.appendChild(el('p', null, x.descrizione || ''));
    const m = el('div', 'meta'); m.appendChild(pill(x.stato || 'Parcheggiato', 's-' + String(x.stato || 'Parcheggiato').replace(/ /g, '-')));
    if (x.categoria) m.appendChild(pill(x.categoria)); if (x.valutazione) m.appendChild(pill('★ ' + String(x.valutazione).split(' · ')[0]));
    b.appendChild(m); b.onclick = () => { seleziona(i); apri(x); }; box.appendChild(b);
  });
}
function aggiornaInfo() {
  const x = LISTA[SEL], box = $('info'); box.replaceChildren();
  if (!x) return;
  box.appendChild(el('div', 'id', x.id + '  ·  POSTO ' + (SEL + 1) + ' DI ' + LISTA.length + '  ·  ' + String(x.stato || 'Parcheggiato').toUpperCase()));
  box.appendChild(el('h2', null, x.nome)); box.appendChild(el('p', null, x.descrizione || ''));
  box.appendChild(el('div', 'aiuto', '← → per spostarti · Invio o clic sull\'app per aprirla · trascina per esplorare l\'hangar'));
}

/* ================= MOCKUP (immagini delle app, arrivano da Apps Script) ================= */
const IMG = {}, IMG_DATI = {};
function caricaImmagini() {
  const da = IDEE.filter(x => x.immagine && !IMG_DATI[x.id + '|' + x.immagine]);
  const prossima = () => {
    const x = da.shift(); if (!x) return;
    fetch(CFG.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', body: JSON.stringify({ azione: 'garage_immagine', id: x.id, codice: CFG.codice }) })
      .then(r => r.json()).then(j => {
        if (!j.ok || !j.immagine) return;
        IMG_DATI[x.id + '|' + x.immagine] = j.immagine;
        const im = new Image(); im.onload = () => { IMG[x.id] = im; if (H.pronto && H.aggiornaFaccia) H.aggiornaFaccia(x.id); disegnaElenco(); if (APERTA === x.id) apri(x); }; im.src = j.immagine;
      }).catch(() => {}).finally(prossima);
  };
  for (let k = 0; k < 3; k++) prossima();
}

/* ================= SELEZIONE, SCHEDA, CONFERME ================= */
function seleziona(i) {
  if (!LISTA.length) return;
  SEL = (i + LISTA.length) % LISTA.length;
  [...document.querySelectorAll('.posto')].forEach((c, j) => c.classList.toggle('sel', j === SEL));
  aggiornaInfo(); if (H.pronto) H.vaiA(SEL);
  if (APERTA) apri(LISTA[SEL]);
}
function apri(x) {
  if (!x) return; APERTA = x.id;
  $('sId').textContent = x.id; $('sTitolo').textContent = icona(x) + '  ' + x.nome;
  if (IMG[x.id]) { $('sImg').src = IMG[x.id].src; $('sImg').hidden = false; } else { $('sImg').hidden = true; $('sImg').removeAttribute('src'); } $('sDesc').textContent = x.descrizione || '—'; $('sNote').textContent = x.note || '—';
  const m = $('sMeta'); m.replaceChildren(); m.appendChild(pill(x.stato || 'Parcheggiato', 's-' + String(x.stato || '').replace(/ /g, '-')));
  if (x.categoria) m.appendChild(pill(x.categoria)); if (x.priorita) m.appendChild(pill('Priorità: ' + x.priorita));
  const f = $('sFunz'); f.replaceChildren(); String(x.funzioni || '').split(/;|\n/).map(s => s.trim()).filter(Boolean).forEach(s => f.appendChild(el('li', null, s)));
  if (!f.children.length) f.appendChild(el('li', null, '—'));
  const v = $('sVal'); v.replaceChildren();
  if (x.valutazione) { const parti = String(x.valutazione).split(' · '); v.appendChild(el('h4', null, 'Valutazione di ARGUS')); const p = el('p', null, parti[0] + ' ');
    if (parti[1] && /^https:\/\//.test(parti[1])) { const a = el('a', null, 'Apri il documento'); a.href = parti[1]; a.target = '_blank'; a.rel = 'noopener'; p.appendChild(a); } v.appendChild(p); }
  $('velo').hidden = false; $('chiudi').focus();
}
function chiudi() { $('velo').hidden = true; APERTA = null; rimettiElimina(); $('scena').focus(); }
/* Elimina: primo tocco = chiede conferma (5 s), secondo tocco = elimina davvero */
let ELIM = null;
function rimettiElimina() { ELIM = null; clearTimeout(rimettiElimina.t); const b = $('eliminaBtn'); b.classList.remove('pronto'); b.disabled = false; b.textContent = '🗑 Elimina idea';
  $('eliminaNota').textContent = 'Elimina per sempre (se vuoi solo nasconderla, usa 👎 archivia).'; }
$('eliminaBtn').onclick = function () {
  const x = IDEE.find(i => i.id === APERTA); if (!x) return;
  if (!ELIM || ELIM !== x.id) { ELIM = x.id; this.classList.add('pronto'); this.textContent = 'Confermi? Tocca di nuovo per eliminare';
    $('eliminaNota').textContent = '«' + x.nome + '» sparisce dal garage; il mockup va nel cestino di Drive.'; clearTimeout(rimettiElimina.t); rimettiElimina.t = setTimeout(rimettiElimina, 6000); return; }
  clearTimeout(rimettiElimina.t); this.disabled = true; this.textContent = 'Elimino…'; const id = x.id;
  fetch(CFG.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow',
    body: JSON.stringify({ azione: 'garage_elimina', id, conferma: true, codice: CFG.codice }) })
    .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.errore || 'non riuscito'); delete IMG[id]; delete IMG_DATI[id]; chiudi(); carica();
      $('conferma').textContent = '🗑 ' + id + ' eliminata.'; $('conferma').hidden = false; setTimeout(annullaConferma, 3500); })
    .catch(e => { rimettiElimina(); stato('Non ci sono riuscito: ' + e.message, true); });
};
function ideaSel() { return LISTA[SEL]; }
function chiediConferma(cosa) {
  const x = ideaSel(); if (!x) return;
  CONF = { cosa, id: x.id, t: Date.now() }; const c = $('conferma');
  c.textContent = (cosa === 'Promosso' ? '👍 Promuovere «' + x.nome + '»? La squadra prepara il piano di lancio.' : '👎 Archiviare «' + x.nome + '»?') + '   Rifai il gesto per confermare · ✊ annulla';
  c.hidden = false; clearTimeout(chiediConferma.t); chiediConferma.t = setTimeout(annullaConferma, 6000);
}
function annullaConferma() { CONF = null; $('conferma').hidden = true; }
function confermaSeServe(cosa) { if (CONF && CONF.cosa === cosa && Date.now() - CONF.t < 6000) { const c = CONF; annullaConferma(); cambiaStato(c.id, c.cosa); return true; } return false; }
function cambiaStato(id, st) {
  stato(st === 'Promosso' ? 'Promuovo ' + id + '…' : 'Archivio ' + id + '…');
  fetch(CFG.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow',
    body: JSON.stringify(st === 'Promosso' ? { azione: 'garage_promuovi', idea: id, codice: CFG.codice } : { azione: 'garage_aggiorna', id, campo: 'stato', valore: st, codice: CFG.codice }) })
    .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.errore || 'non riuscito'); stato(''); chiudi(); carica();
      $('conferma').textContent = st === 'Promosso' ? '✓ ' + id + ' promossa: il piano di lancio arriva su Telegram.' : '✓ ' + id + ' archiviata.'; $('conferma').hidden = false; setTimeout(annullaConferma, 3500); })
    .catch(e => stato('Non ci sono riuscito: ' + e.message, true));
}

$('chiudi').onclick = chiudi; $('velo').addEventListener('click', e => { if (e.target === $('velo')) chiudi(); });
$('cerca').oninput = () => { SEL = 0; filtra(); }; $('aggiorna').onclick = carica;
$('prec').onclick = () => seleziona(SEL - 1); $('succ').onclick = () => seleziona(SEL + 1); $('apriBtn').onclick = () => apri(LISTA[SEL]);
$('vistaBtn').onclick = function () { const su = !$('elenco').classList.contains('su'); $('elenco').classList.toggle('su', su); this.setAttribute('aria-pressed', String(su)); };
/* aperto da ARGUS in una finestra a parte: «← ARGUS» la chiude e ARGUS resta acceso dietro */
$('indietro').onclick = () => { if (window.opener && !window.opener.closed) window.close(); else location.href = 'index.html'; };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { chiudi(); annullaConferma(); return; }
  if (e.target && (e.target.id === 'cerca')) return;
  if (e.key === 'ArrowRight') { seleziona(SEL + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { seleziona(SEL - 1); e.preventDefault(); }
  else if (e.key === 'Enter' && $('velo').hidden && document.activeElement && document.activeElement.tagName !== 'BUTTON') apri(LISTA[SEL]);
});

    if (giu && mosso) { const i = Math.round(trascinaX / PASSO); seleziona(Math.max(0, Math.min(LISTA.length - 1, i))); }
    else { const i = colpito(e); if (i >= 0) { if (i === SEL) apri(LISTA[i]); else seleziona(i); } }
    giu = null; trascinaX = null; guarda = 0;
  });
  canvas.addEventListener('wheel', e => { e.preventDefault(); spinta += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY);
    if (Math.abs(spinta) > 80) { seleziona(SEL + (spinta > 0 ? 1 : -1)); spinta = 0; } }, { passive: false });
  // --- animazione ---
  const orologio = THREE.Timer ? new THREE.Timer() : new THREE.Clock(); let fermo = false;
  document.addEventListener('visibilitychange', () => { fermo = document.hidden; if (!fermo) requestAnimationFrame(giro); });
  function giro() {
    if (fermo) return; requestAnimationFrame(giro);
    if (orologio.update) orologio.update(); const dt = Math.min(0.05, orologio.getDelta()), t = orologio.getElapsed ? orologio.getElapsed() : orologio.elapsedTime;
    const meta = trascinaX != null ? trascinaX : obiettivoX;

    cam.position.set(camX + Math.sin(t * 0.25) * 0.15 + guarda * 2, 2.9 + Math.sin(t * 0.4) * 0.05, innerWidth < innerHeight ? 13.0 : 10.8);
    cam.lookAt(camX + guarda * 1.2, 1.85, 0);
    faro.position.set(camX, 9, 4); faro.target.position.set(camX, 0, 0); riempi.position.set(camX, 3, 3);
    posti.forEach((p, i) => {
      const scelto = i === SEL, vicino = i === sopra;
      p.app.position.y = 1.95 + (ridotto ? 0 : Math.sin(t * 1.2 + p.fase) * 0.07);
      const ry = scelto ? (ridotto ? 0 : Math.sin(t * 0.6) * 0.12) : (camX - i * PASSO) * 0.08 + Math.sin(t * 0.5 + p.fase) * 0.08;
      p.app.rotation.y += (ry - p.app.rotation.y) * Math.min(1, dt * 4);
      const sc = scelto ? 1.10 : vicino ? 1.04 : 1; p.app.scale.setScalar(p.app.scale.x + (sc - p.app.scale.x) * Math.min(1, dt * 6));
      p.anello.rotation.z = t * (scelto ? 0.9 : 0.3); p.anello2.rotation.z = -t * 0.6;
      p.fascio.material.opacity = scelto ? 0.028 + Math.sin(t * 2) * 0.008 : 0.008;
      p.bordo.material.opacity = scelto ? 1 : vicino ? 0.9 : 0.55;
    });
    polvere.rotation.y = t * 0.01; polvere.position.x = camX * 0.6;
    composer.render();
  }
  H.pronto = true; H.costruisci(); requestAnimationFrame(giro); canvas.focus();
}

/* ================= GESTI (MediaPipe, come in ARGUS: tutto sul dispositivo) ================= */
const G = { on: false, avvio: false, rec: null, video: null, stream: null, last: 0, x: innerWidth / 2, y: innerHeight / 2, pz: false, pzT: 0, pzX: 0, pzY: 0, hov: null,
  gesto: '', gestoT: 0, gestoFatto: '', polso: [], swipeT: 0, mostraPrev: true, frames: 0, visto: 0 };
const MP_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MP_MODELLO = 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task';
const entro = (ms, pr, cosa) => Promise.race([pr, new Promise((ok, ko) => setTimeout(() => ko(new Error(cosa + ': nessuna risposta dopo ' + Math.round(ms / 1000) + ' secondi')), ms))]);
const etichettaG = t => { $('gprevT').textContent = t ? ('GESTI · ' + t) : 'GESTI'; };
function creaRic(del) { etichettaG(del === 'GPU' ? 'SCARICO IL MODELLO' : 'USO IL PROCESSORE');
  return entro(del === 'GPU' ? 15000 : 45000, G.vision.GestureRecognizer.createFromOptions(G.fs, { baseOptions: { modelAssetPath: MP_MODELLO, delegate: del }, runningMode: 'VIDEO', numHands: 1,
    minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5 }), 'modello della mano').then(r => { try { G.rec && G.rec.close(); } catch (e) {} G.rec = r; G.del = del; G.frames = 0; G.inizio = performance.now(); }); }
function caricaG() { if (G.rec) return Promise.resolve(); etichettaG('SCARICO LA LIBRERIA');
  return entro(30000, import(MP_URL + '/vision_bundle.mjs'), 'libreria MediaPipe').then(v => { G.vision = v; return entro(30000, v.FilesetResolver.forVisionTasks(MP_URL + '/wasm'), 'motore MediaPipe'); })
    .then(fs => { G.fs = fs; return creaRic('GPU').catch(() => creaRic('CPU')); }); }
function attivaG() { if (G.avvio) return; G.avvio = true; $('gestiBtn').setAttribute('aria-pressed', 'true'); $('gprev').hidden = false;
  caricaG().then(() => { etichettaG('ACCENDO LA WEBCAM'); return navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false }); })
    .then(s => { G.stream = s; G.video = $('gvid'); G.video.srcObject = s; return G.video.play(); })
    .then(() => { G.on = true; G.avvio = false; G.visto = 0; G.inizio = performance.now(); $('gcur').hidden = false; etichettaG('');
      $('conferma').textContent = 'Gesti attivi: 👋 scorri = cambia app · ✋ apri · ✊ chiudi · 👍 promuovi · 👎 archivia · ☝️ cursore, pizzica = clic'; $('conferma').hidden = false; setTimeout(annullaConferma, 5000);
      setTimeout(() => { if (G.on && !G.visto) stato('Non vedo la mano: mettila davanti alla webcam a 40-70 cm, palmo verso lo schermo, con più luce davanti.', true); }, 14000);
      requestAnimationFrame(cicloG); })
    .catch(e => { G.avvio = false; spegniG(); stato('Gesti non disponibili: ' + (e && e.message || e), true); }); }
function spegniG() { G.on = false; $('gestiBtn').setAttribute('aria-pressed', 'false'); $('gcur').hidden = true; $('gprev').hidden = true;
  try { G.stream && G.stream.getTracks().forEach(t => t.stop()); } catch (e) {} G.stream = null; if (G.hov) { G.hov.classList.remove('ghov'); G.hov = null; } }
$('gestiBtn').onclick = () => { if (G.avvio) return; G.on || G.stream ? spegniG() : attivaG(); };
$('gprev').onclick = function () { G.mostraPrev = false; this.hidden = true; };
document.addEventListener('visibilitychange', () => { if (document.hidden && G.on) spegniG(); });
function sotto(x, y) { $('gcur').style.visibility = 'hidden'; const e = document.elementFromPoint(x, y); $('gcur').style.visibility = ''; return e; }
const cliccabileG = e => e && e.closest('button,a,input,.chip');
function anteprimaG(l) { const cv = $('gcan'), c = cv.getContext('2d'); cv.width = 160; cv.height = 120; try { c.drawImage(G.video, 0, 0, 160, 120); } catch (e) {}
  c.fillStyle = 'rgba(7,7,10,.35)'; c.fillRect(0, 0, 160, 120); if (!l) { etichettaG('… cerco la mano'); return; } etichettaG('✋ MANO');
  c.fillStyle = '#b5f4ff'; l.forEach((p, i) => { c.globalAlpha = i === 8 || i === 4 ? 1 : .6; c.beginPath(); c.arc(p.x * 160, p.y * 120, i === 8 || i === 4 ? 3 : 2, 0, 7); c.fill(); }); c.globalAlpha = 1; }
function gestoFermo(n) {
  if (n === 'Open_Palm') { if ($('velo').hidden) apri(LISTA[SEL]); etichettaG('APRO'); }
  else if (n === 'Closed_Fist') { if (CONF) { annullaConferma(); etichettaG('ANNULLATO'); } else { chiudi(); etichettaG('CHIUSO'); } }
  else if (n === 'Thumb_Up') { if (!confermaSeServe('Promosso')) chiediConferma('Promosso'); etichettaG('👍'); }
  else if (n === 'Thumb_Down') { if (!confermaSeServe('Archiviato')) chiediConferma('Archiviato'); etichettaG('👎'); }
}
function cicloG() {
  if (!G.on) return; requestAnimationFrame(cicloG);
  const ora = performance.now(); if (ora - G.last < 66 || !G.video || G.video.readyState < 2 || G.cambio) return; G.last = ora;
  let res; try { res = G.rec.recognizeForVideo(G.video, ora); } catch (e) { return; }
  G.frames++; const l = res && res.landmarks && res.landmarks[0]; if (G.mostraPrev) anteprimaG(l);
  if (!G.visto && G.del === 'GPU' && ora - G.inizio > 6000 && G.frames > 40) { G.cambio = true; creaRic('CPU').then(() => { G.cambio = false; }, () => { G.cambio = false; }); return; }
  if (!l) { if (G.pz) { G.pz = false; $('gcur').classList.remove('pz'); } G.gesto = ''; G.polso = []; return; }
  G.visto = 1;
  let tx = (1 - l[8].x - 0.15) / 0.7 * innerWidth, ty = (l[8].y - 0.12) / 0.6 * innerHeight;
  tx = Math.max(0, Math.min(innerWidth, tx)); ty = Math.max(0, Math.min(innerHeight, ty)); G.x += (tx - G.x) * 0.45; G.y += (ty - G.y) * 0.45;
  $('gcur').style.transform = 'translate(' + Math.round(G.x) + 'px,' + Math.round(G.y) + 'px)';
  const mano = Math.hypot(l[0].x - l[9].x, l[0].y - l[9].y) || 0.1, dist = Math.hypot(l[4].x - l[8].x, l[4].y - l[8].y) / mano;
  if (!G.pz && dist < 0.32) { G.pz = true; G.pzT = ora; G.pzX = G.x; G.pzY = G.y; $('gcur').classList.add('pz'); }
  else if (G.pz && dist > 0.5) { G.pz = false; $('gcur').classList.remove('pz');
    if (Math.abs(G.x - G.pzX) + Math.abs(G.y - G.pzY) < 40 && ora - G.pzT < 900) { const t = sotto(G.x, G.y); const c = cliccabileG(t);
      if (c) c.click(); else if (t && t.id === 'scena') t.dispatchEvent(new PointerEvent('pointerup', { clientX: G.x, clientY: G.y, bubbles: true })); } }
  if (!G.pz) { const h = cliccabileG(sotto(G.x, G.y)); if (h !== G.hov) { if (G.hov) G.hov.classList.remove('ghov'); G.hov = h; if (h) h.classList.add('ghov'); } }
  const wx = 1 - l[0].x; G.polso.push({ x: wx, t: ora }); while (G.polso.length && ora - G.polso[0].t > 350) G.polso.shift();
  if (!G.pz && G.polso.length > 3 && ora - G.swipeT > 1100) { const dx = wx - G.polso[0].x;
    if (Math.abs(dx) > 0.33) { G.swipeT = ora; G.polso = []; seleziona(SEL + (dx > 0 ? 1 : -1)); etichettaG(dx > 0 ? 'SUCCESSIVA ▶' : '◀ PRECEDENTE'); return; } }
  const g = (res.gestures && res.gestures[0] && res.gestures[0][0]) || {}; let n = g.score > 0.65 ? g.categoryName : ''; if (G.pz || n === 'None') n = '';
  if (n !== G.gesto) { G.gesto = n; G.gestoT = ora; if (!n) G.gestoFatto = ''; }
  else if (n && G.gestoFatto !== n && ora - G.gestoT > (n === 'Open_Palm' ? 700 : 550) && ora - G.swipeT > 800) { G.gestoFatto = n; gestoFermo(n); }
}

avvia3D();
carica();
</script>
