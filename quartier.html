<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#030711">
<title>A.R.G.U.S. · Quartier generale</title>
<style>
:root{--bg:#030711;--cy:#20d9ff;--cy2:#b5f4ff;--tx:#e8f7ff;--mu:#8da9c1;--line:rgba(32,217,255,.28);--panel:linear-gradient(140deg,rgba(6,18,36,.94),rgba(12,14,34,.9))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 55%,#0b1d3a 0%,#05101f 45%,#030711 75%)}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(32,217,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(32,217,255,.045) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at 50% 55%,#000 30%,transparent 75%);pointer-events:none}
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));background:linear-gradient(180deg,rgba(3,7,17,.95),rgba(3,7,17,0))}
.tit small{display:block;font-size:10.5px;letter-spacing:.34em;color:var(--cy)}.tit b{font-size:clamp(14px,2.1vw,20px);letter-spacing:.24em}
.tab{margin-left:14px;display:flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(8,20,39,.8);font-size:13px}
.tab i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-weight:800;background:linear-gradient(135deg,#20d9ff,#5a7bff);color:#03101f}
button{font:inherit;cursor:pointer;color:var(--cy2);background:rgba(32,217,255,.08);border:1px solid rgba(32,217,255,.42);border-radius:999px;padding:9px 14px;white-space:nowrap}
button:hover{background:rgba(32,217,255,.18)}button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.x{width:40px;height:40px;padding:0;font-size:18px;flex:none}
.sp{flex:1}
#pres{border-color:rgba(255,201,77,.6);color:#ffe2a0;background:rgba(255,201,77,.08)}
#pres.on{background:rgba(255,201,77,.22)}
@media(max-width:700px){.tab{display:none}#pres span{display:none}}
#hq{position:fixed;left:0;right:0;top:64px;bottom:0;width:100%;height:calc(100% - 64px);display:block}
.settore{transition:opacity .4s}
.settore path{transition:fill-opacity .4s,stroke-opacity .4s}
.settore.on path{fill-opacity:.32}
.etis{font-size:15px;letter-spacing:.32em;font-weight:700;text-transform:uppercase}
.ag{cursor:pointer;outline:none}
.ag .alone{transition:opacity .4s,transform .4s;transform-box:fill-box;transform-origin:center;animation:respira 3.6s ease-in-out infinite}
.ag .fig{transition:transform .35s;transform-box:fill-box;transform-origin:50% 100%}
.ag:hover .fig,.ag:focus-visible .fig,.ag.on .fig{transform:scale(1.13)}
.ag.on .alone{opacity:1!important;transform:scale(1.35)}
.ag.spento{opacity:.28}
.ag .nome{font-size:12.5px;font-weight:600;fill:#e8f7ff}.ag .ruolo{font-size:10px;letter-spacing:.16em;fill:#8da9c1;text-transform:uppercase}
@keyframes respira{0%,100%{opacity:.55}50%{opacity:.95}}
@keyframes gira{to{transform:rotate(360deg)}}
.giro{transform-box:fill-box;transform-origin:center;animation:gira 60s linear infinite}
.giro2{transform-box:fill-box;transform-origin:center;animation:gira 90s linear infinite reverse}
.scheda{position:fixed;z-index:6;right:14px;top:74px;width:min(370px,calc(100vw - 28px));max-height:calc(100% - 92px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--c,var(--cy));border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 30px rgba(32,217,255,.08);padding:14px 16px 16px;transform:translateX(115%);transition:transform .45s cubic-bezier(.3,.8,.3,1)}
.scheda.su{transform:none}
@media(max-width:700px){.scheda{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:58vh;transform:translateY(calc(100% + 40px))}#hq{top:70px}}
.scheda .rep{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--c,var(--cy))}
.scheda h2{margin:4px 0 8px;font-size:20px;line-height:1.25}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid rgba(85,232,178,.45);color:#9ff5d3;background:rgba(85,232,178,.08);margin:0 4px 4px 0}
.chip.g{border-color:var(--line);color:var(--cy2);background:rgba(32,217,255,.06)}
.chip i{width:7px;height:7px;border-radius:50%;background:#55e8b2;box-shadow:0 0 8px #55e8b2}
.campo{margin:12px 0 0}.campo small{display:block;font-size:10.5px;letter-spacing:.2em;color:var(--c,var(--cy));text-transform:uppercase;margin-bottom:3px}
.campo div{color:#d6e9f7}
.num{display:flex;flex-wrap:wrap;gap:8px}.num span{flex:1 1 120px;padding:8px 10px;border:1px solid rgba(32,217,255,.16);border-radius:12px;background:rgba(32,217,255,.04)}
.num b{display:block;font-size:20px;color:#fff}.num em{font-style:normal;font-size:11.5px;color:var(--mu)}
.ult p{margin:6px 0;padding-left:10px;border-left:2px solid var(--c,var(--cy));color:#c9deef;font-size:13px}
.chiudiS{position:absolute;right:10px;top:10px;width:32px;height:32px;font-size:15px}
.sott{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;width:min(760px,calc(100vw - 30px));text-align:center;font-size:clamp(15px,2vw,20px);line-height:1.45;color:#fff;text-shadow:0 2px 12px #000;pointer-events:none;opacity:0;transition:opacity .35s}
.sott.su{opacity:1}
.stato{position:fixed;inset:0;display:grid;place-items:center;color:var(--mu);z-index:4;pointer-events:none;text-align:center;padding:20px}
.stato.err{color:#ffb4a8;pointer-events:auto}
</style>
</head>
<body>
<div class="top">
  <button class="x" id="chiudi" aria-label="Chiudi il quartier generale">✕</button>
  <div class="tit"><small>A.R.G.U.S.</small><b>QUARTIER GENERALE</b></div>
  <div class="tab" title="Azienda"><i id="sigla">C</i><span id="azNome">CybernetLab</span></div>
  <div class="sp"></div>
  <button id="pres" aria-label="Presentami la squadra">▶ <span>Presentami la squadra</span></button>
</div>
<svg id="hq" viewBox="-520 -500 1040 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="La squadra di agenti di ARGUS"></svg>
<div class="stato" id="stato">Chiamo la squadra…</div>
<aside class="scheda" id="scheda" aria-live="polite"></aside>
<div class="sott" id="sott"></div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var NS='http://www.w3.org/2000/svg';
var CFG={};try{CFG=JSON.parse(localStorage.getItem('jarvis_cfg'))||{};}catch(e){}
var dentro=window.parent!==window, DATI=null, SCELTO=null, PRES=null;
function stato(t,err){$('stato').textContent=t||'';$('stato').className='stato'+(err?' err':'');$('stato').hidden=!t;}
function api(d){
  if(!CFG.url)return Promise.reject(new Error('Apri ARGUS su questo dispositivo e collegalo (⚙), poi torna qui.'));
  d.codice=CFG.codice;
  return fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',body:JSON.stringify(d)}).then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.errore||'richiesta non riuscita');return j;});
}
function el(tag,at,padre){var e=document.createElementNS(NS,tag);for(var k in at)e.setAttribute(k,at[k]);if(padre)padre.appendChild(e);return e;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function colore(rep){if(rep==='centro')return '#20d9ff';var r=(DATI.reparti||[]).filter(function(x){return x.k===rep;})[0];return r?r.colore:'#20d9ff';}
function arco(r1,r2,a1,a2){var p=function(r,a){return [r*Math.cos(a),r*Math.sin(a)];};var A=p(r2,a1),B=p(r2,a2),C=p(r1,a2),D=p(r1,a1),g=(a2-a1)>Math.PI?1:0;
  return 'M'+A+' A'+r2+','+r2+' 0 '+g+' 1 '+B+' L'+C+' A'+r1+','+r1+' 0 '+g+' 0 '+D+' Z';}

function disegna(){
  var s=$('hq');s.innerHTML='';
  var defs=el('defs',{},s);
  var f=el('filter',{id:'bagliore',x:'-50%',y:'-50%',width:'200%',height:'200%'},defs);el('feGaussianBlur',{stdDeviation:'7',result:'b'},f);var m=el('feMerge',{},f);el('feMergeNode',{in:'b'},m);el('feMergeNode',{in:'SourceGraphic'},m);
  var rg=el('radialGradient',{id:'hub'},defs);el('stop',{offset:'0','stop-color':'#123a63'},rg);el('stop',{offset:'1','stop-color':'#051226'},rg);
  // anelli decorativi
  el('circle',{r:470,fill:'none',stroke:'rgba(32,217,255,.12)','stroke-width':1},s);
  el('circle',{r:455,fill:'none',stroke:'rgba(32,217,255,.25)','stroke-width':1.2,'stroke-dasharray':'2 12',class:'giro'},s);
  el('circle',{r:170,fill:'none',stroke:'rgba(32,217,255,.22)','stroke-width':1,'stroke-dasharray':'30 10 4 10',class:'giro2'},s);
  // settori dei reparti
  var rep=DATI.reparti||[],n=rep.length,passo=2*Math.PI/n,inizio=-Math.PI/2-passo/2;
  rep.forEach(function(r,i){
    var a1=inizio+i*passo+0.025,a2=inizio+(i+1)*passo-0.025,g=el('g',{class:'settore','data-rep':r.k},s);
    el('path',{d:arco(185,440,a1,a2),fill:r.colore,'fill-opacity':.1,stroke:r.colore,'stroke-opacity':.45,'stroke-width':1.2},g);
    var am=(a1+a2)/2,tx=Math.cos(am)*468,ty=Math.sin(am)*468;
    var t=el('text',{x:tx,y:ty,'text-anchor':'middle','dominant-baseline':'middle',fill:r.colore,class:'etis',transform:'rotate('+(((am*180/Math.PI)+90+360)%360>90&&((am*180/Math.PI)+90+360)%360<270?(am*180/Math.PI)-90:(am*180/Math.PI)+90)+' '+tx+' '+ty+')'},g);
    t.textContent=r.nome;
    r._a1=a1;r._a2=a2;
  });
  // centro: logo dell'azienda
  el('circle',{r:118,fill:'url(#hub)',stroke:'#20d9ff','stroke-opacity':.6,'stroke-width':2,filter:'url(#bagliore)'},s);
  var lt=el('text',{x:0,y:-10,'text-anchor':'middle','dominant-baseline':'middle','font-size':86,'font-weight':800,fill:'#e8fbff',filter:'url(#bagliore)'},s);lt.textContent=DATI.azienda.sigla||'C';
  var nt=el('text',{x:0,y:58,'text-anchor':'middle','font-size':13,'letter-spacing':'.4em',fill:'#8fe9ff'},s);nt.textContent=String(DATI.azienda.nome||'').toUpperCase();
  // agenti
  var perRep={};(DATI.agenti||[]).forEach(function(a){(perRep[a.reparto]=perRep[a.reparto]||[]).push(a);});
  (DATI.agenti||[]).forEach(function(a,idx){
    var x,y;
    if(a.reparto==='centro'){x=0;y=-190;}
    else{var r=rep.filter(function(z){return z.k===a.reparto;})[0];if(!r)return;var l=perRep[a.reparto],k=l.indexOf(a),tot=l.length;
      var am=r._a1+(r._a2-r._a1)*(k+1)/(tot+1),rr=tot>2?(k%2?285:345):310;x=Math.cos(am)*rr;y=Math.sin(am)*rr;}
    agente(s,a,x,y,idx);
  });
}
function agente(s,a,x,y,idx){
  var c=colore(a.reparto),g=el('g',{class:'ag',tabindex:0,role:'button','aria-label':a.nome+', '+a.sostituisce,'data-k':a.k,transform:'translate('+x+','+y+')'},s);
  el('ellipse',{cx:0,cy:26,rx:38,ry:11,fill:c,'fill-opacity':.35,class:'alone',filter:'url(#bagliore)',style:'animation-delay:'+(idx*0.37)+'s'},g);
  el('ellipse',{cx:0,cy:26,rx:30,ry:8,fill:'none',stroke:c,'stroke-width':1.5},g);
  var fig=el('g',{class:'fig'},g);
  el('path',{d:'M-22,24 C-22,4 -12,-2 0,-2 C12,-2 22,4 22,24 Z',fill:c,'fill-opacity':.75,filter:'url(#bagliore)'},fig);
  el('circle',{cx:0,cy:-16,r:12,fill:c,'fill-opacity':.9,filter:'url(#bagliore)'},fig);
  var ic=el('text',{x:0,y:12,'text-anchor':'middle','font-size':15},fig);ic.textContent=a.icona||'🤖';
  var n=el('text',{x:0,y:54,'text-anchor':'middle',class:'nome'},g);n.textContent=a.nome.replace(/^ARGUS\s+/,'')||a.nome;
  var r=el('text',{x:0,y:69,'text-anchor':'middle',class:'ruolo'},g);r.textContent=a.sostituisce;
  if(a.bot){var b=el('circle',{cx:20,cy:-26,r:5,fill:'#55e8b2'},g);el('title',{},b).textContent='Ha il suo bot nel gruppo';}
  g.addEventListener('click',function(){scegli(a.k);});
  g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();scegli(a.k);}});
}
function scegli(k,daPres){
  SCELTO=k;var a=(DATI.agenti||[]).filter(function(x){return x.k===k;})[0];if(!a)return;
  document.querySelectorAll('.ag').forEach(function(g){g.classList.toggle('on',g.getAttribute('data-k')===k);g.classList.toggle('spento',!!daPres&&g.getAttribute('data-k')!==k);});
  document.querySelectorAll('.settore').forEach(function(g){g.classList.toggle('on',g.getAttribute('data-rep')===a.reparto);});
  var c=colore(a.reparto),rep=a.reparto==='centro'?'Direzione':((DATI.reparti||[]).filter(function(r){return r.k===a.reparto;})[0]||{}).nome;
  var num=Object.keys(a.numeri||{}).map(function(k){return '<span><b>'+esc(a.numeri[k])+'</b><em>'+esc(k)+'</em></span>';}).join('');
  var sc=$('scheda');sc.style.setProperty('--c',c);
  sc.innerHTML='<button class="x chiudiS" id="sx" aria-label="Chiudi la scheda">✕</button><div class="rep">'+esc(DATI.azienda.nome)+' / '+esc(rep)+'</div><h2>'+esc(a.icona)+' '+esc(a.nome)+'</h2>'+
    '<span class="chip"><i></i>Attivo</span><span class="chip g">Agente AI · H24</span>'+(a.bot?'<span class="chip g">bot nel gruppo</span>':'')+
    '<div class="campo"><small>Il dipendente che sostituisce</small><div>'+esc(a.sostituisce)+'</div></div>'+
    '<div class="campo"><small>Cosa fa</small><div>'+esc(a.fa)+'</div></div>'+
    (num?'<div class="campo"><small>Adesso</small><div class="num">'+num+'</div></div>':'')+
    (a.ultime&&a.ultime.length?'<div class="campo ult"><small>Ultime parole nel gruppo</small>'+a.ultime.map(function(u){return '<p>'+esc(u)+'</p>';}).join('')+'</div>':'');
  sc.classList.add('su');
  $('sx').onclick=function(){chiudiScheda();};
}
function chiudiScheda(){$('scheda').classList.remove('su');SCELTO=null;document.querySelectorAll('.ag').forEach(function(g){g.classList.remove('on','spento');});document.querySelectorAll('.settore').forEach(function(g){g.classList.remove('on');});}
function sottotitolo(t){var s=$('sott');s.textContent=t||'';s.classList.toggle('su',!!t);}

/* ---------- presentazione a voce ---------- */
function presenta(){
  if(PRES){fermaPresentazione();return;}
  $('pres').classList.add('on');sottotitolo('Preparo la presentazione…');
  api({azione:'squadra_hq',presenta:true}).then(function(j){
    DATI=j;disegna();var p=j.presentazione;if(!p){sottotitolo('');$('pres').classList.remove('on');return;}
    var passi=[{t:p.apertura}];(DATI.agenti||[]).forEach(function(a){var f=(p.agenti||[]).filter(function(x){return x.k===a.k;})[0];if(f)passi.push({k:a.k,t:f.frase});});passi.push({t:p.chiusura,fine:true});
    PRES={passi:passi};
    if(dentro)parent.postMessage({argus:'parlaSequenza',righe:passi.map(function(x){return x.t;})},'*');
    else locale(passi.map(function(x){return x.t;}));
  },function(e){sottotitolo('');$('pres').classList.remove('on');stato(e.message,true);});
}
function passo(i){
  if(!PRES)return;var p=PRES.passi[i];if(!p)return;sottotitolo(p.t);
  if(p.k)scegli(p.k,true);else if(p.fine){chiudiScheda();}else chiudiScheda();
}
function fermaPresentazione(){if(dentro)parent.postMessage({argus:'fermaVoce'},'*');else try{speechSynthesis.cancel();}catch(e){}PRES=null;$('pres').classList.remove('on');sottotitolo('');chiudiScheda();}
function locale(righe){var i=0;var via=function(){if(!PRES)return;if(i>=righe.length){fermaPresentazione();return;}passo(i);var u=new SpeechSynthesisUtterance(righe[i]);u.lang='it-IT';u.onend=u.onerror=function(){i++;via();};try{speechSynthesis.speak(u);}catch(e){i++;setTimeout(via,2500);}};via();}
window.addEventListener('message',function(e){var d=e.data||{};
  if(d.argus==='riga')passo(d.i);
  else if(d.argus==='finePresentazione'){PRES=null;$('pres').classList.remove('on');setTimeout(function(){sottotitolo('');chiudiScheda();},1500);}
  else if(d.argus==='presentaSquadra'&&!PRES)presenta();});

$('pres').onclick=presenta;
$('chiudi').onclick=function(){fermaPresentazione();if(dentro)parent.postMessage({argus:'chiudiQuartier'},'*');else location.href='./';};
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(SCELTO)chiudiScheda();else $('chiudi').click();}});
api({azione:'squadra_hq'}).then(function(j){DATI=j;stato('');$('azNome').textContent=j.azienda.nome;$('sigla').textContent=j.azienda.sigla;disegna();
  if(/presenta=1/.test(location.search))setTimeout(presenta,600);
},function(e){stato(e.message,true);});
})();
</script>
</body>
</html>
